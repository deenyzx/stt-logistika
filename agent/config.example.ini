; Copy this file to config.ini (same folder) and fill it in. config.ini is not committed to git.

[app]
; The address of the app on Vercel.
url = https://stt-logistika.vercel.app
; STOCK_AGENT_TOKEN from Vercel → Project → Settings → Environment Variables.
stock_token = PASTE_STOCK_AGENT_TOKEN
; How often to check, in seconds.
interval_seconds = 60

[zalihe]
; The folder where the CSV exports end up (the output of your PDF → CSV script).
watch_dir = C:\EKI\izvoz
pattern = *.csv
; Optional: let the agent run your scraper on every new invoice PDF.
; {pdf} and {csv} are replaced with the file paths. Leave empty if you run the script yourself.
pdf_dir =
scraper_cmd =
; Example:
; pdf_dir = C:\EKI\fakture_pdf
; scraper_cmd = python C:\skripte\fakture_u_csv.py "{pdf}" "{csv}"

[email]
; Optional: read the company mailbox (IMAP) and send new emails to Prijem. The app sorts them into
; orders ("Narudžbe"), customers' emails ("Emailovi kupaca") and the rest ("Ostalo").
imap_host =
imap_port = 993
imap_user =
imap_password =
; One or more folders, comma-separated. INBOX is the normal inbox.
folders = INBOX
; Copy from the app: Postavke → Integracije → Email narudžbe.
inbound_url =
; Skip newsletters, mailing lists and automatic replies (unless the subject mentions an order).
skip_bulk = yes
; Never send mail from these senders (parts of the address, comma-separated), e.g. your own colleagues or a supplier's system.
ignore_from = noreply@facebook, @linkedin.com
; Only look at emails from the last N days.
since_days = 3
; On the first run, skip what is already in the mailbox.
skip_existing = yes
